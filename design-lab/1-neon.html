<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pict-Portal · Propuesta 1 · Neón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  :root {
    --bg: #07020f;
    --panel: rgba(18, 9, 38, 0.78);
    --line: rgba(34, 211, 238, 0.32);
    --cyan: #22d3ee;
    --pink: #f472b6;
    --violet: #a78bfa;
    --lime: #a3e635;
    --text: #f5f3ff;
    --muted: #b9b3d6;
    --radius: 18px;
    --display: "Unbounded", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- animated synthwave backdrop ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(ellipse 80% 50% at 50% 115%, rgba(244, 114, 182, 0.35), transparent 70%),
                radial-gradient(ellipse 60% 40% at 15% 0%, rgba(167, 139, 250, 0.18), transparent 70%), var(--bg); }
  .bg::before { content: ""; position: absolute; left: 50%; bottom: 18%; width: 46vmin; height: 46vmin; transform: translateX(-50%);
    border-radius: 50%; opacity: 0.22;
    background: repeating-linear-gradient(to bottom, var(--pink) 0 14px, transparent 14px 20px);
    mask-image: linear-gradient(to bottom, black 40%, transparent 85%); filter: blur(1px); }
  .bg::after { content: ""; position: absolute; left: -50%; right: -50%; bottom: -8%; height: 52%;
    background-image: linear-gradient(rgba(34, 211, 238, 0.4) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(34, 211, 238, 0.4) 1px, transparent 1px);
    background-size: 64px 64px; transform: perspective(420px) rotateX(64deg); transform-origin: bottom;
    mask-image: linear-gradient(to top, black 20%, transparent 90%); animation: grid-run 2.2s linear infinite; }
  @keyframes grid-run { to { background-position: 0 64px; } }

  /* ---------- layout ---------- */
  .app { min-height: 100dvh; display: grid; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(150px + env(safe-area-inset-bottom));
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "top" "word" "stage" "panel"; align-content: start; }
  .top { grid-area: top; } .word { grid-area: word; } .stage { grid-area: stage; }
  .sidetabs { grid-area: tabs; display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .sidetabs button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
  .sidetabs button[aria-selected="true"] { background: rgba(34, 211, 238, 0.15); color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .players, .score, .chat { grid-area: panel; }
  body:not([data-tab="players"]) .players, body:not([data-tab="score"]) .score, body:not([data-tab="chat"]) .chat { display: none; }
  .answer { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 30; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; }

  /* B · tablet vertical: two columns, page scrolls, every panel visible */
  @media (orientation: portrait) and (min-width: 700px) {
    .app { padding: 20px 20px 24px; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-areas: "top top" "word word" "stage stage" "answer answer" "players chat" "score chat"; }
    .players { grid-area: players; } .score { grid-area: score; } .chat { grid-area: chat; }
    body[data-tab] .players, body[data-tab] .score, body[data-tab] .chat { display: flex; }
    .answer { position: static; grid-area: answer; }
    body .tabbar { display: none; }
    .chat .chat-list { max-height: 360px; }
  }
  /* C · horizontal compacto (teléfono o tablet acostados): lienzo grande + columna con pestañas */
  @media (orientation: landscape) and (min-width: 560px) {
    .app { height: 100dvh; overflow: hidden; padding: 12px 16px; gap: 12px; grid-template-columns: minmax(0, 1fr) clamp(260px, 30vw, 340px);
      grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top top" "word tabs" "stage panel" "stage answer"; }
    .sidetabs { display: grid; }
    body[data-tab="players"] .players, body[data-tab="score"] .score, body[data-tab="chat"] .chat { display: flex; }
    .panel { overflow: auto; }
    .answer { position: static; grid-area: answer; }
    body .tabbar { display: none; }
    .chat .chat-list { max-height: none; }
    .stage { container-type: size; min-height: 0; }
    .stage .board { width: min(100cqw, calc((100cqh - var(--bar-h)) * 1.5)); }
  }
  /* D · escritorio: tres columnas, sin scroll */
  @media (orientation: landscape) and (min-width: 1280px) {
    .app { padding: 20px; gap: 16px; grid-template-columns: 270px minmax(0, 1fr) 350px; grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "top top top" "players word chat" "players stage chat" "score stage answer"; }
    .players { grid-area: players; } .score { grid-area: score; } .chat { grid-area: chat; }
    body[data-tab] .players, body[data-tab] .score, body[data-tab] .chat { display: flex; }
    .sidetabs { display: none; }
    .answer { align-self: end; }
  }

  /* ---------- panels ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03), 0 0 28px rgba(34, 211, 238, 0.10); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .panel h2 { margin: 0; font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
    text-shadow: 0 0 10px rgba(34, 211, 238, 0.6); display: flex; align-items: center; justify-content: space-between; }

  /* ---------- top bar ---------- */
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .icon-btn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; padding: 0; transition: box-shadow 0.2s, transform 0.15s; }
  .icon-btn:hover { box-shadow: 0 0 16px rgba(34, 211, 238, 0.5); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 20px; height: 20px; }
  .brand { font-family: var(--display); font-weight: 800; font-size: clamp(16px, 4.6vw, 24px); letter-spacing: 0.04em; margin: 0;
    color: #fff; text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink), 0 0 36px rgba(244, 114, 182, 0.6); animation: flicker 7s infinite; }
  .brand span { color: #fff; text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan), 0 0 36px rgba(34, 211, 238, 0.6); }
  @keyframes flicker { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; } 20%, 62% { opacity: 0.55; } }
  .meta { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .chip { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); white-space: nowrap; }
  .chip strong { color: var(--text); font-family: var(--display); font-weight: 700; letter-spacing: 0.1em; font-size: 12px; }
  .hide-sm { display: none; }
  @media (min-width: 560px) { .hide-sm { display: inline-flex; } }

  .ring { position: relative; width: 56px; height: 56px; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring__track { stroke: rgba(34, 211, 238, 0.15); }
  .ring__bar { stroke: var(--cyan); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--progress, 1) * 100);
    transition: stroke-dashoffset 1s linear, stroke 0.3s; filter: drop-shadow(0 0 6px var(--cyan)); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 17px; font-weight: 800; }
  .is-urgent .ring__bar { stroke: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
  .is-urgent .ring { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .role { display: inline-flex; padding: 3px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .role button { height: 36px; padding: 0 12px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
  .role button[aria-pressed="true"] { background: linear-gradient(90deg, var(--cyan), var(--violet)); color: #07020f; box-shadow: 0 0 16px rgba(34, 211, 238, 0.55); }

  /* ---------- word ---------- */
  .word { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .word__label { font-size: 13px; color: var(--muted); width: 100%; }
  @media (min-width: 700px) { .word__label { width: auto; } }
  .tiles { display: flex; gap: clamp(4px, 1.2vw, 8px); flex: 1; }
  .tile { width: clamp(30px, 9vw, 46px); aspect-ratio: 4 / 5; border-radius: 10px; border: 2px solid rgba(34, 211, 238, 0.7);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: clamp(14px, 4vw, 22px); color: #fff;
    text-shadow: 0 0 8px var(--cyan); background: rgba(34, 211, 238, 0.06);
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.35), inset 0 0 12px rgba(34, 211, 238, 0.15);
    animation: tile-in 0.45s cubic-bezier(.2, .9, .3, 1.3) both; animation-delay: calc(var(--i) * 55ms); }
  .tile.is-hint { border-color: var(--pink); text-shadow: 0 0 8px var(--pink); box-shadow: 0 0 14px rgba(244, 114, 182, 0.6); }
  .is-solved .tile { border-color: var(--lime); text-shadow: 0 0 10px var(--lime); box-shadow: 0 0 18px rgba(163, 230, 53, 0.6); animation: tile-win 0.6s both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes tile-in { from { transform: translateY(10px) scale(0.6); opacity: 0; } }
  @keyframes tile-win { 50% { transform: translateY(-10px) rotate(-6deg); } }
  .neon-btn { height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--pink); background: rgba(244, 114, 182, 0.1); color: #fff; font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 0 14px rgba(244, 114, 182, 0.3); transition: box-shadow 0.2s, transform 0.15s; }
  .neon-btn:hover { box-shadow: 0 0 24px rgba(244, 114, 182, 0.65); }
  .neon-btn:active { transform: scale(0.96); }
  .neon-btn svg { width: 18px; height: 18px; }

  /* ---------- stage ---------- */
  [data-role="draw"] .stage { --bar-h: 128px; }
  .stage { --bar-h: 64px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .board { position: relative; width: 100%; padding: 3px; border-radius: 22px;
    background: conic-gradient(from var(--a), var(--cyan), var(--pink), var(--violet), var(--cyan)); animation: spin 6s linear infinite;
    box-shadow: 0 0 40px rgba(167, 139, 250, 0.35); }
  @keyframes spin { to { --a: 360deg; } }
  .board canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 19px; background: #0b0618; touch-action: none; }
  [data-role="draw"] .board canvas { cursor: crosshair; }
  .board::after { content: ""; position: absolute; inset: 3px; border-radius: 19px; pointer-events: none; opacity: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(34, 211, 238, 0.28) 48%, rgba(34, 211, 238, 0.65) 50%, transparent 52%);
    background-size: 100% 220%; }
  .is-ai-thinking .board::after { opacity: 1; animation: scan 1.4s linear infinite; }
  @keyframes scan { from { background-position: 0 120%; } to { background-position: 0 -20%; } }
  .board__tag { position: absolute; left: 14px; top: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--cyan);
    text-transform: uppercase; opacity: 0; transition: opacity 0.2s; text-shadow: 0 0 8px var(--cyan); }
  .is-ai-thinking .board__tag { opacity: 1; }

  .bar { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 54px; }
  .tool { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
  .tool svg { width: 20px; height: 20px; }
  .tool[aria-pressed="true"] { border-color: var(--cyan); box-shadow: 0 0 14px rgba(34, 211, 238, 0.6); color: var(--cyan); }
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .swatch[aria-pressed="true"] { border-color: #fff; transform: scale(1.15); }
  .size { width: 40px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; border-radius: 12px; }
  .size i { display: block; width: var(--s); height: var(--s); border-radius: 50%; background: var(--text); box-shadow: 0 0 8px var(--cyan); }
  .size[aria-pressed="true"] { background: rgba(34, 211, 238, 0.15); }
  .sep { width: 1px; height: 28px; background: var(--line); }
  .react { color: var(--c); }
  .react:hover { box-shadow: 0 0 16px var(--c); }

  [data-role="guess"] [data-when="draw"], [data-role="draw"] [data-when="guess"] { display: none !important; }

  /* ---------- players & score ---------- */
  .row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .avatar { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--c); color: #fff; flex: 0 0 auto; }
  .avatar::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--c); opacity: 0.6; box-shadow: 0 0 12px var(--c); }
  .avatar svg { width: 20px; height: 20px; }
  .avatar--ai { background: radial-gradient(circle at 35% 30%, #67e8f9, #0e7490 70%); animation: orb 2.4s ease-in-out infinite; }
  @keyframes orb { 50% { box-shadow: 0 0 22px rgba(34, 211, 238, 0.9); } }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .who b { font-weight: 600; }
  .who small { font-size: 12px; color: var(--muted); }
  .who small.is-live { color: var(--cyan); }
  .pts { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .is-bump { animation: bump 0.6s; }
  @keyframes bump { 40% { transform: scale(1.5); color: var(--lime); text-shadow: 0 0 12px var(--lime); } }
  .rank { display: grid; gap: 10px; }
  .rk { font-size: 14px; }
  .rk__pos { font-family: var(--display); font-weight: 800; color: var(--muted); }
  .rk.is-lead .rk__pos { color: var(--pink); text-shadow: 0 0 10px var(--pink); }
  .rk__pts { font-family: var(--display); font-weight: 800; font-size: 17px; }
  .rk__bar i { background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 10px var(--cyan); }
  .rk__plus { color: var(--lime); text-shadow: 0 0 10px var(--lime); }
  .rank__row { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
  .rank__bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .rank__bar i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 10px var(--cyan); }

  /* ---------- chat ---------- */
  .chat { min-height: 280px; }
  .chat-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 0; max-height: 40dvh; scroll-behavior: smooth; }
  .msg { align-self: flex-start; max-width: 88%; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08); font-size: 14px; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; animation: msg-in 0.3s ease-out; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } }
  .msg__who { font-weight: 700; font-size: 13px; }
  .msg__time { display: none; }
  .msg--ai .msg__who { color: var(--cyan); }
  .msg--peer .msg__who { color: var(--violet); }
  .msg--me { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: rgba(244, 114, 182, 0.16); border-color: rgba(244, 114, 182, 0.5); }
  .msg--me .msg__who { display: none; }
  .msg--system { align-self: center; background: none; border: 0; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .msg--success { align-self: stretch; max-width: none; background: rgba(163, 230, 53, 0.12); border-color: var(--lime); box-shadow: 0 0 16px rgba(163, 230, 53, 0.35); }
  .msg--success .msg__who { color: var(--lime); }
  .typing { min-height: 18px; font-size: 12px; color: var(--muted); }
  .typing.is-on::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--cyan); }
  @keyframes blink { 50% { opacity: 0; } }
  .ai-bars { display: grid; gap: 6px; }
  .ai-bar { display: grid; grid-template-columns: 84px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ai-bar__track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .ai-bar__track i { display: block; height: 100%; width: var(--w); background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: grow 0.8s ease-out; }
  @keyframes grow { from { width: 0; } }
  .ai-bar__pct { text-align: right; color: var(--text); font-weight: 600; }

  /* ---------- answer ---------- */
  .answer form { display: flex; gap: 8px; }
  .answer input { flex: 1; min-width: 0; height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid var(--line); background: rgba(10, 4, 24, 0.92);
    font-size: 16px; box-shadow: 0 0 18px rgba(34, 211, 238, 0.15); }
  .answer input::placeholder { color: var(--muted); }
  .answer input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 22px rgba(34, 211, 238, 0.5); }
  .send { width: 52px; height: 52px; border-radius: 26px; border: 0; background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; display: grid; place-items: center;
    box-shadow: 0 0 20px rgba(244, 114, 182, 0.6); padding: 0; flex: 0 0 auto; }
  .send svg { width: 20px; height: 20px; }
  .drawing-note { height: 52px; border-radius: 26px; border: 1px dashed var(--line); display: grid; place-items: center; font-size: 14px; color: var(--muted); background: rgba(10, 4, 24, 0.92); }

  /* ---------- tabbar ---------- */
  .tabbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    background: rgba(10, 4, 24, 0.9); border-top: 1px solid var(--line); backdrop-filter: blur(12px); }
  .tabbar button { position: relative; min-height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--muted); font-size: 12px; font-weight: 600; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar button[aria-selected="true"] { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  .tabbar button[aria-selected="true"] svg { filter: drop-shadow(0 0 6px var(--cyan)); }
  .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink); color: #07020f; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 10px var(--pink); }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 70; padding: 10px 18px; border-radius: 22px; background: rgba(10, 4, 24, 0.95);
    border: 1px solid var(--cyan); box-shadow: 0 0 24px rgba(34, 211, 238, 0.6); font-weight: 600; font-size: 14px; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body data-role="guess" data-tab="chat">
<div class="bg" aria-hidden="true" data-ambient></div>

<div class="app">
  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="Volver al laboratorio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="brand" data-ambient-self>PICT<span>·PORTAL</span></h1>
    <div class="meta">
      <span class="chip hide-sm">Sala <strong>RMFUQ</strong></span>
      <span class="chip">Ronda <strong data-round>2/5</strong></span>
      <div class="ring" role="timer" aria-label="Segundos restantes">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="ring__track" cx="32" cy="32" r="27" pathLength="100"/><circle class="ring__bar" cx="32" cy="32" r="27" pathLength="100"/></svg>
        <b data-timer>90</b>
      </div>
    </div>
    <div class="role" role="group" aria-label="Probar como">
      <button type="button" data-role-btn="guess" aria-pressed="true">Adivinar</button>
      <button type="button" data-role-btn="draw" aria-pressed="false">Dibujar</button>
    </div>
  </header>

  <section class="word" aria-live="polite">
    <span class="word__label" data-word-label>Luis está dibujando</span>
    <div class="tiles" data-word></div>
    <button type="button" class="neon-btn" data-action="hint" data-when="guess">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      Pista
    </button>
    <button type="button" class="neon-btn" data-action="skip" data-when="draw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l9 7-9 7V5zM18 5v14"/></svg>
      Otra palabra
    </button>
  </section>

  <div class="sidetabs" role="tablist" aria-label="Paneles">
    <button type="button" role="tab" data-tab-btn="chat" aria-selected="true">Chat</button>
    <button type="button" role="tab" data-tab-btn="players" aria-selected="false">Jugadores</button>
    <button type="button" role="tab" data-tab-btn="score" aria-selected="false">Puntos</button>
  </div>

  <main class="stage">
    <div class="board" data-ambient-self>
      <canvas data-board data-bg="#0b0618" data-ink="#22d3ee" data-glow="true" aria-label="Lienzo de dibujo"></canvas>
      <span class="board__tag" aria-hidden="true">IA escaneando…</span>
    </div>

    <div class="bar" data-when="draw" aria-label="Herramientas">
      <button type="button" class="tool" data-tool="pen" aria-pressed="true" aria-label="Lápiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg></button>
      <button type="button" class="tool" data-tool="eraser" aria-pressed="false" aria-label="Borrador"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h12M5 14l8-8 6 6-8 8H8l-3-3z"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="swatch" style="--c:#22d3ee" data-color="#22d3ee" aria-pressed="true" aria-label="Cian"></button>
      <button type="button" class="swatch" style="--c:#f472b6" data-color="#f472b6" aria-pressed="false" aria-label="Rosa"></button>
      <button type="button" class="swatch" style="--c:#facc15" data-color="#facc15" aria-pressed="false" aria-label="Amarillo"></button>
      <button type="button" class="swatch" style="--c:#a3e635" data-color="#a3e635" aria-pressed="false" aria-label="Lima"></button>
      <button type="button" class="swatch" style="--c:#ffffff" data-color="#ffffff" aria-pressed="false" aria-label="Blanco"></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="size" style="--s:6px" data-size="4" aria-pressed="false" aria-label="Trazo fino"><i></i></button>
      <button type="button" class="size" style="--s:11px" data-size="8" aria-pressed="true" aria-label="Trazo medio"><i></i></button>
      <button type="button" class="size" style="--s:17px" data-size="16" aria-pressed="false" aria-label="Trazo grueso"><i></i></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="tool" data-action="undo" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button type="button" class="tool" data-action="clear" aria-label="Limpiar lienzo" style="color:var(--pink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>

    <div class="bar" data-when="guess" aria-label="Reacciones">
      <button type="button" class="tool react" style="--c:#fb923c" data-react aria-label="Reaccionar con fuego"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a6 6 0 0 0 6-6c0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-1-2-3-2 2-3 4-3 7a6 6 0 0 0 6 6z"/></svg></button>
      <button type="button" class="tool react" style="--c:#f472b6" data-react aria-label="Reaccionar con corazón"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></button>
      <button type="button" class="tool react" style="--c:#facc15" data-react aria-label="Reaccionar con risa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
      <button type="button" class="tool react" style="--c:#a3e635" data-react aria-label="Reaccionar con aplauso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18.4 5.6l-2.1 2.1M21 12h-3M8 21l4-9 4 9"/></svg></button>
    </div>
  </main>

  <section class="panel players" aria-label="Jugadores">
    <h2>Jugadores <span>4</span></h2>
    <div class="row"><span class="avatar" style="--c:#0369a1">LU</span><span class="who"><b>Luis <span data-when="draw">(tú)</span></b><small class="is-live">Dibujando</small></span><span class="pts" data-score="luis">85</span></div>
    <div class="row"><span class="avatar" style="--c:#7c3aed">AN</span><span class="who"><b>Ana <span data-when="guess">(tú)</span></b><small>Anfitriona</small></span><span class="pts" data-score="ana">0</span></div>
    <div class="row"><span class="avatar" style="--c:#be185d">MA</span><span class="who"><b>Marta</b><small>Adivinando</small></span><span class="pts" data-score="marta">40</span></div>
    <div class="row"><span class="avatar avatar--ai" style="--c:#22d3ee"><svg viewBox="0 0 24 24" fill="none" stroke="#07020f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg></span><span class="who"><b>IA</b><small>Cree que es: <span data-ai-last>…</span></small></span><span class="pts" data-score="ia">0</span></div>
  </section>

  <section class="panel score" aria-label="Marcador">
    <h2>Marcador</h2>
    <div class="rank" data-rank aria-live="polite"></div>
    <h2 style="margin-top:6px">Lo que ve la IA</h2>
    <div class="ai-bars" data-ai-bars><div class="ai-bar" style="--w:0%"><span class="ai-bar__label">analizando…</span><span class="ai-bar__track"><i></i></span><b class="ai-bar__pct">–</b></div></div>
  </section>

  <section class="panel chat" aria-label="Respuestas">
    <h2>Respuestas</h2>
    <ul class="chat-list" data-chat-list aria-live="polite"></ul>
    <div class="typing" data-typing></div>
  </section>

  <div class="answer">
    <form data-chat-form data-when="guess">
      <label for="g1" class="sr-only">Tu respuesta</label>
      <input id="g1" type="text" autocomplete="off" placeholder="¿Qué está dibujando?" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Enviar respuesta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></button>
    </form>
    <div class="drawing-note" data-when="draw">Estás dibujando · las respuestas llegan al chat</div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Paneles">
    <button type="button" role="tab" data-tab-btn="chat" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/></svg>Chat<span class="badge" data-unread hidden>0</span></button>
    <button type="button" role="tab" data-tab-btn="players" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Jugadores</button>
    <button type="button" role="tab" data-tab-btn="score" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4"/></svg>Puntos</button>
  </nav>
</div>

<div class="toast" data-toast role="status"></div>
<div data-fx data-fx-colors="#22d3ee,#f472b6,#a78bfa,#a3e635,#facc15"></div>
<script type="application/json" id="lab-config">
{
  "style": "neon",
  "primaryVar": "--cyan",
  "inkFollowsPrimary": true,
  "themes": [
    { "id": "synth", "name": "Synthwave", "swatch": ["#22d3ee", "#f472b6", "#a78bfa"], "fx": "#22d3ee,#f472b6,#a78bfa,#a3e635,#facc15",
      "vars": { "--cyan": "#22d3ee", "--pink": "#f472b6", "--violet": "#a78bfa", "--line": "rgba(34, 211, 238, 0.32)" } },
    { "id": "miami", "name": "Miami", "swatch": ["#2dd4bf", "#fb7185", "#fdba74"], "fx": "#2dd4bf,#fb7185,#fdba74,#fde68a",
      "vars": { "--cyan": "#2dd4bf", "--pink": "#fb7185", "--violet": "#fdba74", "--line": "rgba(45, 212, 191, 0.34)" } },
    { "id": "toxico", "name": "Tóxico", "swatch": ["#a3e635", "#facc15", "#4ade80"], "fx": "#a3e635,#facc15,#4ade80,#ecfccb",
      "vars": { "--cyan": "#a3e635", "--pink": "#facc15", "--violet": "#4ade80", "--line": "rgba(163, 230, 53, 0.34)" } },
    { "id": "laser", "name": "Láser rojo", "swatch": ["#f87171", "#e879f9", "#fb923c"], "fx": "#f87171,#e879f9,#fb923c,#fecaca",
      "vars": { "--cyan": "#f87171", "--pink": "#e879f9", "--violet": "#fb923c", "--line": "rgba(248, 113, 113, 0.36)" } }
  ]
}
</script>
<script src="lab.js"></script>
</body>
</html>
